# Local planning defaults; these values are not GPU runtime settings.
images = "auto"
max_images = 8
llm_profile = "lmstudio-4b"
model = "klein-4b"
request_timeout = 300.0
max_output_tokens = 4096
repair_attempts = 1

[llm_profiles.lmstudio-4b]
provider = "openai-compatible"
base_url = "http://127.0.0.1:1234/v1"
model = "qwen3.5-4b-uncensored-hauhaucs-aggressive"
key_env = "KOMAQUILL_LLM_API_KEY"
require_model_match = true
reasoning_effort = "none"
temperature = 0.3

[llm_profiles.lmstudio-9b]
provider = "openai-compatible"
base_url = "http://127.0.0.1:1234/v1"
model = "qwen3.5-9b-uncensored-hauhaucs-aggressive"
key_env = "KOMAQUILL_LLM_API_KEY"
require_model_match = true
reasoning_effort = "none"
temperature = 0.3

[llm_profiles.fake]
provider = "fake"
model = "fake-list"

[planning]
style = "manga illustration, consistent characters and lighting"
guidance = ["One clearly visible moment per panel.", "Keep subject appearance, actions and prop states distinct.", "Preserve the story while simplifying complex poses."]
