# Local planning defaults; these values are not GPU runtime settings.
images = "auto"
max_images = 8
llm_profile = "lmstudio-4b"
image_profile = "klein"
request_timeout = 300.0
max_output_tokens = 4096
repair_attempts = 1

[llm_profiles.lmstudio-4b]
provider = "openai-compatible"
base_url = "http://127.0.0.1:1234/v1"
model = "qwen3.5-4b-uncensored-hauhaucs-aggressive"
key_env = "KOMAQUILL_LLM_API_KEY"
require_model_match = true
reasoning_effort = "none"
temperature = 0.3

[llm_profiles.lmstudio-9b]
provider = "openai-compatible"
base_url = "http://127.0.0.1:1234/v1"
model = "qwen3.5-9b-uncensored-hauhaucs-aggressive"
key_env = "KOMAQUILL_LLM_API_KEY"
require_model_match = true
reasoning_effort = "none"
temperature = 0.3

[llm_profiles.fake]
provider = "fake"
model = "fake-list"

[planning]
style = "simple illustration, consistent colors and lighting"
guidance = ["One still moment with a clear focal subject.", "Use prose to connect events that are difficult to draw.", "Keep necessary relationships; simplify poses, not the plot."]
