name: Checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
    tags: ['v*']
permissions:
  contents: read
env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.artifacts/runtime/venv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.artifacts/runtime/python
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/cache/uv
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.artifacts/cache/pycache
  PYTHONUTF8: '1'
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check quality and installed wheel
        run: uv run --locked --extra colab-client python scripts/check.py --group quality
  quality:
    name: quality
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all platforms
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Check publishable files
        run: uv run --locked python scripts/check.py --group security
