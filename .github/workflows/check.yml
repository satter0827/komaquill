name: Checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'codex/**']
    tags: ['v*']
permissions:
  contents: read
env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.artifacts/runtime/venv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.artifacts/runtime/python
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/cache/uv
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.artifacts/cache/pycache
  PYTHONUTF8: '1'
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Japanese font
        shell: pwsh
        run: | # pragma: allowlist secret Public immutable font URL and SHA256.
          # SIL OFL 1.1: ofl/notosansjp/OFL.txt at the pinned font revision below.
          $fontDirectory = if ($IsWindows) { Join-Path $env:WINDIR 'Fonts' } else { Join-Path $HOME '.local/share/fonts' }
          New-Item -ItemType Directory -Path $fontDirectory -Force | Out-Null
          $fontPath = Join-Path $fontDirectory 'NotoSansJP-VF.ttf'
          if (-not (Test-Path -LiteralPath $fontPath)) {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/295d98a7a0c17c68f1341eaeea354e7960ea70d3/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf' -OutFile $fontPath -TimeoutSec 120
          }
          if ((Get-FileHash -LiteralPath $fontPath -Algorithm SHA256).Hash -ne 'c2f3b4d463500a2ddcd3849cded1fceeb9fd6d1c32e6cbecd568453ba50fc68f') { exit 1 } # pragma: allowlist secret Public font SHA256.
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install dependencies
        run: |
          uv sync --project src/backend --locked --group dev --all-extras
          node bootstrap/setup-node.mjs
          node tools/testing/playwright.mjs install chromium
      - name: Check affected projects
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:NX_BASE -match '^0+$') { pnpm check:all } else { pnpm check:ci }
      - name: Build distributions
        run: pnpm build
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            .artifacts/records/reports
            .artifacts/cache/nx/terminalOutputs
          retention-days: 7
  quality:
    name: quality
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all platforms
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Check publishable files
        run: uv run --project src/backend --locked --group dev python -m tools.checks.secrets --scope history --report-dir .artifacts/records/reports/security
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Audit locked Python dependencies
        run: |
          uv export --project src/backend --locked --all-extras --all-groups --no-emit-project --output-file .artifacts/records/reports/security/dependencies.txt
          uv run --project src/backend --locked --group dev python -m pip_audit --require-hashes --disable-pip --strict --cache-dir .artifacts/cache/pip-audit -r .artifacts/records/reports/security/dependencies.txt --format json --output .artifacts/records/reports/security/python-audit.json
      - name: Audit locked Node dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --json > .artifacts/records/reports/security/node-audit.json
      - name: Retain security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security
          path: .artifacts/records/reports/security
          retention-days: 7
