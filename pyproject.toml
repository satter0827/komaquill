[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".artifacts"]
cache-dir = ".artifacts/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["komaquill"]
mypy_path = "src/backend/src"
cache_dir = ".artifacts/cache/mypy"

[[tool.mypy.overrides]]
# Limit missing-type exemptions to libraries without distributed type markers.
module = ["detect_secrets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/structure", "tests/e2e"]
cache_dir = ".artifacts/cache/pytest"
addopts = ["-ra", "--tb=short", "--strict-config", "--strict-markers", "-p", "no:langsmith_plugin"]
xfail_strict = true

[tool.coverage.run]
source = ["src/backend/src", "scripts", "bootstrap"]
omit = ["*/tests/*"]
relative_files = true
patch = ["subprocess"]
branch = true
data_file = ".artifacts/cache/coverage/.coverage"

[tool.coverage.html]
directory = ".artifacts/cache/coverage/html"

[tool.komaquill.coverage]
line_minimum = 90
branch_minimum = 80

[tool.importlinter]
root_package = "komaquill"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Acyclic package boundaries"
type = "acyclic_siblings"
ancestors = ["komaquill", "komaquill.domain", "komaquill.application"]

[[tool.importlinter.contracts]]
name = "Application and domain do not import concrete adapters or presentation"
type = "forbidden"
source_modules = ["komaquill.application", "komaquill.domain", "komaquill.conversations", "komaquill.images", "komaquill.archive", "komaquill.library"]
forbidden_modules = ["komaquill.adapters", "komaquill.interfaces", "komaquill.worker", "komaquill.messages", "httpx", "filelock", "PIL", "keyring", "colab_cli", "langchain_core", "langchain_openai", "langgraph", "langsmith"]

[[tool.importlinter.contracts]]
name = "GPU code does not import local interfaces or control"
type = "forbidden"
source_modules = ["komaquill.worker"]
forbidden_modules = ["komaquill.cli.main", "komaquill.runtime.worker", "komaquill.adapters.colab", "komaquill.runtime", "komaquill.adapters.colab_entry", "komaquill.conversations", "komaquill.archive", "komaquill.adapters.database", "sqlalchemy", "langchain_core", "langchain_openai", "langgraph", "langsmith"]

[[tool.importlinter.contracts]]
name = "Product code does not import development dependencies"
type = "forbidden"
source_modules = ["komaquill"]
forbidden_modules = ["tests", "scripts", "pytest", "debugpy"]

[tool.uv]
required-version = ">=0.13.5,<0.14"
cache-dir = ".artifacts/cache/uv"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.komaquill.quality]
step_timeout = 900
