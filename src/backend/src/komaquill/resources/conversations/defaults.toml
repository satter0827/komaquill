# Conversation processing limits and selectable connection profiles.
request_timeout = 300.0
max_output_tokens = 4096
repair_attempts = 1
recent_turns = 6
max_input_characters = 32768
summary_max_output_tokens = 512
summary_max_characters = 2048
memory_max_batches = 4
context_window_tokens = 32768
repair_reserve_tokens = 1024

[llm_profiles.fake]
provider = "fake"
model = "fake-list"

[llm_profiles.lmstudio-4b]
provider = "openai-compatible"
model = "qwen3.5-4b-uncensored-hauhaucs-aggressive"
base_url = "http://127.0.0.1:1234/v1"
require_model_match = true
temperature = 0.3
reasoning_effort = "none"
token_counting = "lmstudio"
schema_in_context = false
