batch_size = 2
primary_output_node = "9"
quality_enabled = true
negative_prefix = "text, watermark, signature"
checkpoint = "pony"
width = 1024
height = 1024
steps = 25
cfg = 7.0
sampler = "euler_ancestral"
scheduler = "normal"
clip_skip = -2
positive_prefix = "score_9, score_8_up, score_7_up, score_6_up, score_5_up, score_4_up"
negative = ""
sample_prompt = "rainy shop street, wet pavement, soft storybook illustration"
extensions = ["ipadapter"]
separate_subjects = true
sample_subjects = ["young woman, human hands, short black bob, yellow raincoat, holding a single blue umbrella", "feral gray kitten, white chest patch, four legs, natural cat anatomy"]

[resources]
ipadapter = "ipadapter-sdxl"
clip_vision = "clip-vision-vit-h"

[parameters]
reference_weight = 0.6
cat_weight = 0.8
person_denoise = 0.95
cat_denoise = 0.95
cat_negative = "anthro, human body, clothes, biped, extra animals"

[parameter_bounds]
reference_weight = [0.0, 2.0]
cat_weight = [0.0, 2.0]
person_denoise = [0.0, 1.0]
cat_denoise = [0.0, 1.0]

[seed_offsets]
cat = 1

[output_stages]
"29" = "person"

[image_inputs.reference]
kind = "image"
sample = "reference.png"

[image_inputs.base]
kind = "image"
sample = "base.png"

[image_inputs.person_mask]
kind = "mask"
sample = "person_mask.png"

[image_inputs.cat_mask]
kind = "mask"
sample = "cat_mask.png"

[image_inputs.cat_reference]
kind = "image"
sample = "cat_reference.png"

