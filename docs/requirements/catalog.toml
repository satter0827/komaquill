format_version = 1

[requirements.REQ-GENERATE]
summary = "CLIと標準画面から画像を生成し、実行条件と画像をローカルへ保存する"
status = "implemented"
acceptance = ["CLI・App Mode・Node Graphから生成できる", "保存失敗を成功として扱わず再回収できる"]
sources = ["src/komaquill/application/generation.py", "src/komaquill/infrastructure/storage.py"]
tests = ["tests/integration/test_generation.py", "tests/integration/test_storage.py"]

[requirements.REQ-OWNERSHIP]
summary = "所有するGPUだけを操作し、確認・回収・停止で追加確保しない"
status = "implemented"
acceptance = ["所有IDとアカウントを照合する", "外部ComfyUIを停止しない"]
sources = ["src/komaquill/infrastructure/colab.py", "src/komaquill/application/lifecycle.py"]
tests = ["tests/integration/test_colab_provider.py", "tests/unit/test_lifecycle.py"]

[requirements.REQ-QUALITY]
summary = "GPUなしで検査し、全工程が成功した場合だけ成功を確定する"
status = "implemented"
acceptance = ["L1・L2・L3を累積しGPUなしで実行できる", "中断・起動失敗・入力変更・個別検査で全体の最新成功を更新しない", "行90%以上・分岐80%以上を独立判定する"]
sources = ["scripts/check.py", "scripts/checks/coverage.py"]
tests = ["tests/unit/test_quality.py", "tests/unit/test_gate.py", "tests/unit/test_verification_contracts.py", "tests/integration/test_acceptance.py"]

[requirements.REQ-BUNDLES]
summary = "利用者が生成セットをフォルダー単位で追加・置換できる"
status = "implemented"
acceptance = ["標準ワークフローと設定を一式で扱う", "GPU確保前に参照を検証する"]
sources = ["src/komaquill/infrastructure/preset_catalog.py", "src/komaquill/infrastructure/workflows.py"]
tests = ["tests/unit/test_preset_bundles.py", "tests/unit/test_presets.py"]

[requirements.REQ-CLEAN]
summary = "保全対象を削除せず、再作成可能な生成物だけを整理する"
status = "implemented"
acceptance = ["プレビューできる", "使用中・用途不明のデータを除外する", "削除結果を記録する"]
sources = ["src/komaquill/infrastructure/cleanup.py", "src/komaquill/application/cleanup.py"]
tests = ["tests/unit/test_cleanup.py", "tests/integration/test_cleanup_processes.py"]

[requirements.REQ-STORY]
summary = "ストーリーから自動または指定枚数の場面を計画し本文と画像を順次保存する"
status = "implemented"
acceptance = ["1〜8場面の計画全体を検証する", "本文・原文参照・補足と画像を関連付ける", "計画と試行を分けて再生成・再開する", "実LLMを明示許可し日常ゲートではFakeを使う", "保存済み場面を重複生成せず部分失敗を報告する"]
sources = ["src/komaquill/domain/stories.py", "src/komaquill/application/stories/planning.py", "src/komaquill/application/stories/rendering.py", "src/komaquill/infrastructure/stories/llm.py", "src/komaquill/infrastructure/stories/storage.py", "src/komaquill/interfaces/stories.py"]
tests = ["tests/unit/stories/test_automatic.py", "tests/unit/stories/test_planning.py", "tests/unit/stories/test_rendering.py", "tests/integration/stories/test_cli.py", "tests/integration/stories/test_llm.py", "tests/structure/test_stories.py"]

[requirements.REQ-SESSION]
summary = "端末終了後も一つの監視で接続と回収を維持する"
status = "implemented"
acceptance = ["二重起動とPID再利用を識別する", "起動時の検証済み設定を共有する"]
sources = ["src/komaquill/infrastructure/supervisor.py", "src/komaquill/infrastructure/sessions/startup.py"]
tests = ["tests/unit/test_monitor.py", "tests/integration/test_startup.py"]

[requirements.REQ-ASSETS]
summary = "確認した公開モデルをハッシュで管理し必要なものだけ準備する"
status = "implemented"
acceptance = ["取得前に容量・取得元を確認する", "再利用・取消・再開を扱う"]
sources = ["src/komaquill/infrastructure/preparation.py", "src/komaquill/interfaces/comfyui/api.py"]
tests = ["tests/unit/test_assets.py", "tests/unit/test_preparation.py"]

[requirements.REQ-MATERIALS]
summary = "入力画像・マスク・明示保存ワークフローを版ごとに保持する"
status = "implemented"
acceptance = ["上書き前の版を残す", "保存時の入力版を復元する"]
sources = ["src/komaquill/infrastructure/materials.py", "src/komaquill/interfaces/comfyui/preservation.py"]
tests = ["tests/unit/test_materials.py", "tests/integration/test_preservation.py"]

[requirements.REQ-PACKAGE]
summary = "リポジトリ外でもwheelから初期化・生成・GPU転送できる"
status = "implemented"
acceptance = ["Gitと編集可能インストールへ依存しない", "生成物と秘密情報を配布しない"]
sources = ["src/komaquill/infrastructure/provenance.py", "scripts/checks/distribution.py"]
tests = ["tests/e2e/test_wheel.py", "tests/integration/test_distribution.py"]

[requirements.REQ-DOCS]
summary = "要件から運用まで参照でき、現在設計と将来計画を区別できる"
status = "implemented"
acceptance = ["要件と実装・テストを対応付ける", "文書の内部リンクと参照先を検査する"]
sources = ["scripts/checks/documentation.py"]
tests = ["tests/unit/test_docs.py"]

[requirements.REQ-EVALUATIONS]
summary = "過去の生成へ人とAIの評価を関連付け、分析用の条件と画像参照を出力する"
status = "implemented"
acceptance = ["採否・選好・基準・根拠・評価者とAIの版を保存する", "訂正は追記し生成条件を変更しない", "未評価の生成も分析用に出力する"]
sources = ["src/komaquill/domain/evaluations.py", "src/komaquill/application/evaluations.py", "src/komaquill/infrastructure/evaluations.py"]
tests = ["tests/unit/test_evaluations.py", "tests/integration/test_acceptance.py"]

[requirements.REQ-PYTHON]
summary = "wheelを導入したPythonからCLIと同じ処理を利用する"
status = "implemented"
acceptance = ["明示した作業場所で計画・生成・取得・再開を行う", "importで通信やファイル作成を行わない", "公開型と追加依存の境界を検証する"]
sources = ["src/komaquill/api/client.py", "src/komaquill/api/stories.py", "src/komaquill/api/services.py"]
tests = ["tests/integration/test_public_api.py"]

[requirements.REQ-STORY-STORAGE]
summary = "作品内で本文と画像を順番に閲覧し既存データを保全して移行する"
status = "implemented"
acceptance = ["画像の正本を作品内へ集約する", "移行中断後に再開し原本を照合する", "配置表を記録から再構築する", "閲覧用出力の失敗を画像保存と分ける"]
sources = ["src/komaquill/infrastructure/locations.py", "src/komaquill/infrastructure/migration.py", "src/komaquill/infrastructure/stories/publication.py"]
tests = ["tests/integration/stories/test_storage.py"]

[requirements.REQ-STORY-EVIDENCE]
summary = "失敗を隔離し、変更された作品を更新して比較用の要約と原本を取得する"
status = "implemented"
acceptance = ["保存成功と終端到達を区別する", "破損記録を未送信として再送しない", "無変更時に全作品を再構築しない", "要約と詳細の条件・集計が一致し画像を解決できる", "原文・計画・試行・配置の同一性と参照を検証する", "閲覧用更新の失敗でも後続画像を生成する", "破損した任意評価を明示して正常分を出力する"]
sources = ["src/komaquill/domain/story_evidence.py", "src/komaquill/infrastructure/stories/evidence.py", "src/komaquill/infrastructure/stories/publication.py"]
tests = ["tests/integration/stories/test_failures.py", "tests/integration/stories/test_publication.py", "tests/integration/stories/test_story_evidence.py", "tests/integration/stories/test_integrity.py"]

[requirements.REQ-STORY-VISUALS]
summary = "物語の役割と小物を明示し、公開グラフと固定入力で画像生成を比較する"
status = "implemented"
acceptance = ["新規計画の種別・対象・動作・小物参照を検証する", "品質用の正負プロンプトを既定で適用し設定で無効化する", "生成試行の入力を固定し再開時に再合成しない", "APIと標準画面の条件を揃えて元入力と実行条件を保存する", "過去形式を推測で補わず画像と履歴を保持する"]
sources = ["src/komaquill/domain/images.py", "src/komaquill/application/stories/image_inputs.py", "src/komaquill/resources/presets/pony-story/preset.toml"]
tests = ["tests/unit/test_image_inputs.py", "tests/unit/stories/test_visual_specification.py", "tests/integration/test_acceptance.py"]
